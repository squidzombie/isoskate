<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#2B2140" />
    <meta name="description" content="Dusklane: roll from golden hour into the neon night. A one-thumb endless street-skating game." />
    <title>Dusklane</title>
    <style>
      /* Platform hygiene (TECH §10.1). UI styling lives in src/ui/styles (MU). */
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --ink: #2b2140;
        --paper: #fff4e3;
        color-scheme: light;
      }
      html, body {
        position: fixed; inset: 0; margin: 0; padding: 0;
        overflow: hidden; overscroll-behavior: none;
        user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        background: #2b2140; color: var(--paper);
        font-family: Nunito, ui-rounded, system-ui, sans-serif;
        -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
      }
      #app { position: absolute; inset: 0; width: 100%; height: 100%; height: 100dvh; overflow: hidden; }
      #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #sky-glow, #lofi, #toasts { position: absolute; inset: 0; pointer-events: none; }
      #play { position: absolute; inset: 0; touch-action: none; }
      #play.run { cursor: none; }
      #hud { position: absolute; left: 0; right: 0; top: 0; pointer-events: none; }
      #screens { position: absolute; inset: 0; pointer-events: none; }
      #screens > section { pointer-events: auto; }
      #safe-probe { position: absolute; visibility: hidden; pointer-events: none;
        top: 0; left: 0; width: 0; padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); }
      #boot-fail { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
        padding: 24px; text-align: center; background: var(--paper); color: var(--ink); font-size: 18px; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="gl" aria-hidden="true"></canvas>
      <div id="sky-glow"></div>
      <div id="lofi"></div>
      <div id="play"></div>
      <div id="hud"></div>
      <div id="screens"></div>
      <div id="toasts" aria-live="polite"></div>
      <div id="safe-probe"></div>
      <div id="boot-fail" role="alert"></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
